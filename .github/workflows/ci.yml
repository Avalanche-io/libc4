name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: cmake --version
      # --output-junit needs CMake 3.21 or later; it records each test that
      # did not run, and why. The file is written inside the build tree.
      - run: ctest --test-dir build --output-on-failure --output-junit junit.xml
      - name: Skipped tests
        if: success() || failure()
        run: python3 tools/skips/check.py --junit build/junit.xml --build build
